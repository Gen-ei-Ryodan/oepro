<!DOCTYPE html>
<html><body>
<pre id="out"></pre>
<script>
  fetch('/data/products.json').then(function(r){ return r.json(); }).then(function(products){
    var p = products.find(function(x){ return x.id === 'oepro-polo-dusty-pink'; });
    var imgs = p.images.slice();
    var idx = imgs.findIndex(function(x){ return x.indexOf('dusty-rose.webp') !== -1 && x.indexOf('detail') === -1; });
    if (idx > 0) { var m = imgs.splice(idx,1)[0]; imgs.unshift(m); }
    p.images = imgs;
    localStorage.setItem('oepro_dynamic_products_v5', JSON.stringify(products));
    // now read back
    var raw2 = localStorage.getItem('oepro_dynamic_products_v5');
    var products2 = JSON.parse(raw2);
    var p2 = products2.find(function(x){ return x.id === 'oepro-polo-dusty-pink'; });
    document.getElementById('out').textContent = 'saved images[0] = ' + p2.images[0] + '\nkey exists: ' + (raw2 !== null);
  });
</script>
</body></html>
